{% extends 'base.html' %}{% block title %}Reports • Admin{% endblock %}{% block content %}<div class="section-head"><div><span class="eyebrow">ADMIN / REPORTS</span><h1>Event Reports</h1></div></div><section class="panel glass"><div class="table-wrap"><table><thead><tr><th>Event</th><th>Date</th><th>Registered</th><th>Present</th><th>Certificates</th></tr></thead><tbody>{% for e,reg,pres,cert in rows %}<tr><td><b>{{e.title}}</b></td><td>{{e.event_date.strftime('%d %b %Y')}}</td><td>{{reg}}</td><td>{{pres}}</td><td>{{cert}}</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
