{% extends 'base.html' %}{% block title %}Profile • RGM College Events{% endblock %}{% block content %}<section class="panel glass"><div class="section-head"><div><span class="eyebrow">ACCOUNT</span><h1>My Profile</h1></div></div><form method="post" class="form-grid"><label>Full Name<input name="name" value="{{user.name}}"></label><label>Email<input disabled value="{{user.email}}"></label><label>Student ID<input disabled value="{{user.student_id or ''}}"></label><label>Department<input name="department" value="{{user.department or ''}}"></label><label>Year<input name="year" value="{{user.year or ''}}"></label><label>Phone<input name="phone" value="{{user.phone or ''}}"></label><button class="btn btn-primary">Save Changes</button></form></section>{% endblock %}
